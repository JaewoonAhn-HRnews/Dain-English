<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D2A5B">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-title" content="독서 노트">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="../icon-192.png">
<title>다인의 영어 독서 노트</title>
<style>
:root{--bg:#EDF1F7;--ink:#1D2A5B;--pencil:#5B6272;--line:#D5DFEE;--surface:#fff;--margin:#E0464C}
@media (prefers-color-scheme:dark){:root{--bg:#0F1530;--ink:#E7ECF9;--pencil:#A2ABC4;--line:#2B3768;--surface:#171F3F}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;padding:24px 16px}
main{max-width:440px;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:28px 22px;text-align:center}
h1{font-size:24px;margin:0 0 8px}
p{color:var(--pencil);font-size:15px;line-height:1.6;margin:0 0 18px}
a.btn{display:block;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:700;border-radius:14px;padding:15px;font-size:16px}
ol{text-align:left;color:var(--pencil);font-size:14px;line-height:1.7;padding-left:20px;margin:20px 0 0}
small{display:block;margin-top:16px;color:var(--pencil);font-size:12px}
</style>
</head>
<body>
<main>
  <h1>📒 다인의 영어 독서 노트</h1>
  <p>손글씨 읽기와 첨삭은 Claude에서 동작해요.<br>아래 버튼을 누르면 독서 노트가 열려요.</p>
  <a class="btn" id="go" href="https://claude.ai/artifact/G31X8ALv3KCczguVJWsaGx">독서 노트 열기</a>
  <ol>
    <li>이 브라우저에서 claude.ai에 로그인되어 있어야 해요.</li>
    <li>Claude 앱 대신 크롬·사파리에서 열어야 사진 선택이 잘 돼요.</li>
    <li>이 화면을 홈 화면에 추가해 두면 앱처럼 쓸 수 있어요.</li>
  </ol>
  <small>아빠 계정으로만 열리는 비공개 페이지예요.</small>
</main>
</body>
</html>
